# ─── Connection pool: tuned so Neon can scale to zero ────────────────────────
# Neon's free plan bills compute (100 CU-hours/month) and suspends the database
# after 5 minutes of inactivity — but ONLY while no connection is open. Hikari
# defaults minimum-idle to maximum-pool-size, so the pool would hold 10 open
# connections forever and the compute would never sleep. At the smallest 0.25 CU
# compute that is 0.25 * 730 = ~182 CU-hours/month: the quota is gone in about
# two weeks with an app serving no traffic at all.
#
# minimum-idle=0     — release every connection when traffic stops
# idle-timeout=30s   — how fast they are released
# keepalive-time=0   — DISABLED on purpose: keepalive pings would reset Neon's
#                      autosuspend timer forever and undo everything above
# max-lifetime=2m    — retire connections quickly so none lingers past an idle window
#
# The cost is a 500ms-2s cold start on the first request after the database has
# slept. That is the trade that makes the free tier viable.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.keepalive-time=0
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=30000
# Cold starts are slower than a warm pool; don't fail startup while Neon wakes.
spring.datasource.hikari.initialization-fail-timeout=-1

# Batch writes so multi-row saves cost one round trip instead of N.
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Keep lazy associations from being loaded during view rendering, which
# silently turns one query into many.
spring.jpa.open-in-view=false

# ─── PostGIS: extension + spatial indexes on startup ─────────────────────────
# import.sql runs ONLY when Hibernate exports the schema — i.e. when ddl-auto is
# create or create-drop. This app runs with ddl-auto=update, so Hibernate skips
# it entirely and the GIST indexes it declares were never actually created:
# every spatial query has been sequentially scanning. It is kept below for the
# data migrations it carries, which matter when a schema IS exported.
spring.jpa.properties.hibernate.hbm2ddl.import_files=import.sql

# Spring's SQL init is independent of ddl-auto, so the indexes get created
# whatever the DDL mode. defer-datasource-initialization makes it run AFTER
# Hibernate has built the tables. Everything in the script is IF NOT EXISTS, so
# repeat startups are no-ops.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/indexes.sql
spring.sql.init.continue-on-error=false
spring.jpa.defer-datasource-initialization=true

# ─── Redis ───────────────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.redis.enabled=false

# Short timeouts so an unreachable Redis costs a moment, not a hung request.
# Cache errors are handled as misses (see CacheConfig.errorHandler), so the
# request still succeeds by querying the database — but only after the client
# gives up, and the default timeout is far too long for a per-request fallback.
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

