# ─── Platform revenue ────────────────────────────────────────────────────────
# Convenience fee charged per rider, by slab on their own fare share.
# Format: upperBound:fee,... ending in a '*:fee' catch-all. Bounds inclusive.
# The fee is CARVED OUT of the quoted fare — a rider quoted ₹20 pays ₹20.
iniato.fee.convenience.slabs=30:2,60:3,100:4,*:5

# Pooled rides: driver pays this share of the fare left after convenience fees.
iniato.fee.pool.driver-commission=0.01

# Direct rides: each side pays this share of the gross fare.
iniato.fee.direct.rider-commission=0.05
iniato.fee.direct.driver-commission=0.05

# Riders pay the driver in cash, so Iniato's cut accrues as a debt. At this
# balance the driver is blocked from going online, creating routes, and
# accepting or starting rides until they settle up.
iniato.dues.threshold=100

# ─── Razorpay (driver dues payments only — riders pay cash) ──────────────────
# Secrets come from the environment; never commit real keys.
razorpay.enabled=${RAZORPAY_ENABLED:false}
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
razorpay.currency=INR
